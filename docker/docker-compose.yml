# Compose project names must be lowercase; this prefixes the containers and network.
name: movierev

services:
  app:
    build:
      context: ..                    # repo root (paths are relative to this file's folder)
      dockerfile: docker/dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env                      # supplies APP_KEY (Compose won't read the root .env otherwise)
    environment:
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: movierev
      DB_USERNAME: root
      DB_PASSWORD: secret

    # Live-mount the source so edits show up without rebuilding the image
    # (the image only COPYs the code at build time). `vendor/` gets its own
    # volume so the image's Linux install isn't shadowed by the host's.
    volumes:
      - ..:/var/www/html
      - vendor:/var/www/html/vendor

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: movierev
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/movierev.sql:/docker-entrypoint-initdb.d/01-movierev.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    name: MovieREV
  vendor:
    name: MovieREV-vendor
